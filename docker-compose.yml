services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sado
      POSTGRES_PASSWORD: sado
      POSTGRES_DB: sado
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sado"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

  api:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      SADO_DATABASE_URL: postgresql+asyncpg://sado:sado@postgres:5432/sado
      SADO_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - media:/data/media

volumes:
  pgdata:
  redisdata:
  media:
