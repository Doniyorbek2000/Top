name: Sado mobile

on:
  push:
    branches: [main, master]
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.7"
  # Keep in sync with TDLIB_COMMIT in mobile/tool/build_tdlib_*.sh and tdlib_ex in pubspec.yaml.
  TDLIB_COMMIT: "c15d3f5a5"

defaults:
  run:
    working-directory: mobile

jobs:
  test:
    name: Analyze & test (real TDLib)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Cache Linux libtdjson
        id: tdlib-linux
        uses: actions/cache@v4
        with:
          path: mobile/.tdlib-linux
          key: tdlib-linux-${{ env.TDLIB_COMMIT }}

      - name: Build libtdjson for Linux
        if: steps.tdlib-linux.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gperf libssl-dev zlib1g-dev ninja-build clang
          git clone --quiet https://github.com/tdlib/td.git /tmp/td
          git -C /tmp/td checkout --quiet "$TDLIB_COMMIT"
          cmake -S /tmp/td -B /tmp/td/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          cmake --build /tmp/td/build --target tdjson
          mkdir -p .tdlib-linux
          cp -L /tmp/td/build/libtdjson.so .tdlib-linux/libtdjson.so

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
        env:
          TDJSON_PATH: ${{ github.workspace }}/mobile/.tdlib-linux/libtdjson.so

  android:
    name: Android APK
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache Android libtdjson
        id: tdlib-android
        uses: actions/cache@v4
        with:
          path: mobile/android/app/src/main/jniLibs
          key: tdlib-android-${{ env.TDLIB_COMMIT }}-v1

      - name: Build libtdjson for Android
        if: steps.tdlib-android.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gperf php-cli
          tool/build_tdlib_android.sh "$RUNNER_TEMP/tdlib-android"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          cat > android/key.properties <<PROPS
          storeFile=release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          PROPS

      - name: Build APKs
        run: >
          flutter build apk --release --split-per-abi
          --dart-define=TG_API_ID=${{ secrets.TG_API_ID }}
          --dart-define=TG_API_HASH=${{ secrets.TG_API_HASH }}

      - uses: actions/upload-artifact@v4
        with:
          name: sado-android
          path: mobile/build/app/outputs/flutter-apk/*.apk

  ios:
    name: iOS (unsigned)
    needs: test
    runs-on: macos-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Cache iOS tdjson.xcframework
        id: tdlib-ios
        uses: actions/cache@v4
        with:
          path: mobile/ios/TDLib/tdjson.xcframework
          key: tdlib-ios-${{ env.TDLIB_COMMIT }}-v1

      - name: Build tdjson.xcframework
        if: steps.tdlib-ios.outputs.cache-hit != 'true'
        run: |
          brew install gperf cmake coreutils
          tool/build_tdlib_ios.sh "$RUNNER_TEMP/tdlib-ios"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build iOS app
        run: >
          flutter build ios --release --no-codesign
          --dart-define=TG_API_ID=${{ secrets.TG_API_ID }}
          --dart-define=TG_API_HASH=${{ secrets.TG_API_HASH }}

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr sado-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: sado-ios-unsigned
          path: mobile/sado-unsigned.ipa
