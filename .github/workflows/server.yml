name: Sado billing server

on:
  push:
    branches: [main, master]
    paths: ["server/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", ".github/workflows/server.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: server

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sado
          POSTGRES_PASSWORD: sado
          POSTGRES_DB: sado_billing_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sado" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      - name: Migrations match models
        env:
          SADO_BILLING_DATABASE_URL: postgresql+asyncpg://sado:sado@localhost:5432/sado_billing_test
          SADO_BILLING_JWT_SECRET: ci-only-secret-ci-only-secret-0123456789
        run: python -m alembic upgrade head && python -m alembic check
